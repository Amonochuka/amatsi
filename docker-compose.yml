services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amatsi
      POSTGRES_PASSWORD: amatsi_dev_password
      POSTGRES_DB: amatsi
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/local_dev_bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./backend/migrations/001_create_users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - ./backend/migrations/002_create_farms.sql:/docker-entrypoint-initdb.d/02-farms.sql:ro
      - ./backend/migrations/003_create_weather.sql:/docker-entrypoint-initdb.d/03-weather.sql:ro
      - ./backend/migrations/004_create_recommendations.sql:/docker-entrypoint-initdb.d/04-recommendations.sql:ro
      - ./backend/migrations/005_create_alerts.sql:/docker-entrypoint-initdb.d/05-alerts.sql:ro
      - ./backend/migrations/007_add_premium_tier.sql:/docker-entrypoint-initdb.d/06-premium.sql:ro
      - ./backend/migrations/008_add_auth_fields.sql:/docker-entrypoint-initdb.d/07-auth-fields.sql:ro
      - ./backend/migrations/009_add_unique_user_phone_number.sql:/docker-entrypoint-initdb.d/08-phone-index.sql:ro
      - ./backend/scripts/seed_data.sql:/docker-entrypoint-initdb.d/09-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amatsi -d amatsi"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports: ["1883:1883", "9001:9001"]
    command: mosquitto -c /mosquitto-no-auth.conf

  ai-service:
    build: ./ai-service
    environment:
      ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      KIJANIBOX_USE_MOCK: "true"
      KIJANIBOX_MOCK_SCENARIO: normal
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      PORT: "8080"
      GIN_MODE: debug
      ALLOWED_ORIGINS: http://localhost:3000
      SUPABASE_DB_URL: postgresql://amatsi:amatsi_dev_password@postgres:5432/amatsi?sslmode=disable
      JWT_SECRET: local-development-secret-change-me
      KIJANIBOX_API_KEY: local-demo-placeholder
      KIJANIBOX_BASE_URL: https://api.kijanispace.eu
      AFRICA_TALKING_API_KEY: local-demo-placeholder
      AFRICA_TALKING_USERNAME: sandbox
      AFRICA_TALKING_SENDER_ID: AMATSI
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8000
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ai-service: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-local-demo-placeholder}
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
  redis_data:
